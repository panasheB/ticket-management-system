<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk Enterprise • Support & Ticket Operations</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366F1'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    code, pre, .ticket-id-link, .api-log-entry {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Left Sidebar Mount -->
    <div id="app-sidebar"></div>

    <!-- Main Content Layout -->
    <div class="main-wrapper">
      <!-- Top Sticky Header Mount -->
      <div id="app-header"></div>

      <!-- Active Workspace View Mount -->
      <main id="app-content"></main>
    </div>

    <!-- Slide-in Ticket Detail Drawer Mount -->
    <div id="app-drawer-container"></div>

    <!-- Modal Mount -->
    <div id="app-modal-container"></div>

    <!-- Live Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Application Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

  <!-- Customer Bot AI Floating Widget -->
  <script src="js/bot-engine.js"></script>
  <script src="js/bot-widget.js"></script>
</body>
</html>
