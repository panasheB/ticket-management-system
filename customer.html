<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HelpDesk Customer Support Bot • AI Assistant</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'><circle cx='12' cy='12' r='10'/><path d='M12 16v-4M12 8h.01' stroke='white' stroke-width='2'/></svg>">
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bot Stylesheet -->
  <link rel="stylesheet" href="css/bot.css">
  <style>
    /* Top banner linking to Staff Portal */
    .portal-switch-banner {
      background: var(--bot-surface-2);
      border-bottom: 1px solid var(--bot-border);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--bot-text-muted);
      flex-shrink: 0;
      z-index: 20;
    }
    .portal-switch-banner a {
      color: var(--bot-accent);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .portal-switch-banner a:hover {
      text-decoration: underline;
    }
    .backend-target-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }
    .backend-target-badge span.dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      display: inline-block;
      transition: background 0.2s ease;
    }
    .backend-target-badge span.dot.mock {
      background: #F59E0B;
    }
    .backend-target-badge span.dot.auto {
      background: #8B5CF6;
    }
    .backend-target-badge span.dot.offline {
      background: #EF4444;
    }
    .mode-pill-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: #8B5CF6;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="bot-page">

  <!-- Switch link for testing -->
  <div class="portal-switch-banner">
    <div class="backend-target-badge">
      <span class="dot" id="banner-status-dot"></span>
      <span id="banner-api-label">API: 127.0.0.1:3200/mongo/tickets</span>
      <span class="mode-pill-badge" id="banner-mode-pill">AUTO</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span>Testing Staff View?</span>
      <a href="index.html">Operations Portal →</a>
    </div>
  </div>

  <!-- Bot App Mount -->
  <div id="bot-app-root" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>

  <!-- Application Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/bot-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('bot-app-root');
      window.botInstance = new HelpDeskBotEngine();
      window.botInstance.init(root);
    });
  </script>
</body>
</html>
